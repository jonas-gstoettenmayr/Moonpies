[project]
name = "moonpies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jonas-Gstoettenmayr", email = "s2410929009@fhooe.at" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "nbstripout>=0.9.1",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
moonpies = "moonpies:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
